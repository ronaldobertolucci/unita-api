server {
    listen 80;
    server_name app;

    location /notifications/stream {
        proxy_pass http://app:8080;

        # Desativa o buffering para permitir o envio em tempo real
        proxy_buffering off;
        proxy_cache off;

        # Configurações para manter a conexão aberta por longo tempo
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_read_timeout 24h; # Evita que o Nginx feche a conexão por inatividade

        # Repassa os headers padrão
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Garante que o encoding de transferência seja chunked (comum em SSE)
        chunked_transfer_encoding on;
    }

    location / {
        proxy_pass http://app:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}