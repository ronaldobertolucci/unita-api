# ============================================
# APPLICATION IDENTITY
# ============================================
spring.application.name=unita-api

# ============================================
# SERVER CONFIGURATION
# ============================================
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# ============================================
# DATABASE CONFIGURATION
# ============================================
# Nota: Credenciais devem ser definidas por profile
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================
# FLYWAY MIGRATION
# ============================================
spring.flyway.enabled=true
spring.flyway.baselineOnMigrate=true
spring.flyway.table=flyway_schema_history
spring.flyway.locations=classpath:db/migration
spring.flyway.validate-on-migrate=true

# ============================================
# SECURITY & JWT
# ============================================
api.security.token.issuer=Unita API
api.security.token.expiration-hours=2

# ============================================
# ADMIN USER INITIALIZATION
# ============================================
admin.initialization.enabled=${ADMIN_INIT_ENABLED:true}

# ============================================
# CORS CONFIGURATION
# ============================================
# Nota: Origins permitidas devem ser definidas por profile

# ============================================
# LOGGING
# ============================================
logging.level.root=INFO
logging.level.com.yourpackage=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ============================================
# TIME ZONE
# ============================================
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo
# Local HTTP deployment; set secure=true when deploying with HTTPS.
api.security.refresh.expiration-days=${AUTH_REFRESH_EXPIRATION_DAYS:7}
api.security.refresh.cookie.secure=${AUTH_COOKIE_SECURE:false}
api.security.refresh.cookie.same-site=${AUTH_COOKIE_SAME_SITE:Lax}
api.security.refresh.cleanup.cron=${AUTH_REFRESH_CLEANUP_CRON:0 30 2 * * ?}
