services:
  app:
    build:
      context: .
    container_name: unita-app
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DATASOURCE_URL=${DATASOURCE_URL}
      - DATASOURCE_USERNAME=${DATASOURCE_USERNAME}
      - DATASOURCE_PASSWORD=${DATASOURCE_PASSWORD}
      - API_SECURITY_TOKEN_PASSWORD=${API_SECURITY_TOKEN_PASSWORD}
      - AUTH_COOKIE_SECURE=${AUTH_COOKIE_SECURE:-false}
      - AUTH_COOKIE_SAME_SITE=${AUTH_COOKIE_SAME_SITE:-Lax}
      - AUTH_REFRESH_EXPIRATION_DAYS=${AUTH_REFRESH_EXPIRATION_DAYS:-7}
      - AUTH_REFRESH_CLEANUP_CRON=${AUTH_REFRESH_CLEANUP_CRON:-0 30 2 * * ?}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ADMIN_INIT_ENABLED=${ADMIN_INIT_ENABLED:-false}
      - ADMIN_FIRSTNAME=${ADMIN_FIRSTNAME}
      - ADMIN_LASTNAME=${ADMIN_LASTNAME}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS}
      - APP_EMAIL_FROM=${APP_EMAIL_FROM}
      - APP_EMAIL_VERIFICATION_EXPIRY_HOURS=${APP_EMAIL_VERIFICATION_EXPIRY_HOURS}
      - APP_FRONTEND_URL=${APP_FRONTEND_URL}
      - APP_NAME=${APP_NAME}
      - MAIL_HOST=${MAIL_HOST}
      - MAIL_PORT=${MAIL_PORT}
      - MAIL_USERNAME=${MAIL_USERNAME}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - MAIL_AUTH=${MAIL_AUTH}
      - MAIL_STARTTLS=${MAIL_STARTTLS}
      - PASSWORD_RESET_TOKEN_EXPIRY_HOURS=${PASSWORD_RESET_TOKEN_EXPIRY_HOURS}
      - PASSWORD_RESET_CLEANUP_CRON=${PASSWORD_RESET_CLEANUP_CRON}
      - RECURRING_SCHEDULE_CRON=${RECURRING_SCHEDULE_CRON:-0 */5 * * * *}
      - RECURRING_PROCESS_CRON=${RECURRING_PROCESS_CRON:-30 * * * * *}
      - RECURRING_BATCH_SIZE=${RECURRING_BATCH_SIZE:-100}
      - RECURRING_MAX_ATTEMPTS=${RECURRING_MAX_ATTEMPTS:-5}
      - RECURRING_RESERVATION_SECONDS=${RECURRING_RESERVATION_SECONDS:-300}
      - RECURRING_PANEL_PATH=${RECURRING_PANEL_PATH:-/recurring-bills}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    container_name: unita-db
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:stable-alpine
    container_name: unita-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx:/etc/nginx/conf.d
    depends_on:
      - app
    restart: unless-stopped

volumes:
  postgres-data:
